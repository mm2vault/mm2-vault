<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MM2 Vault — Ən Dəqiq Trade Dəyərləri</title>
  <meta name="description" content="MM2 Vault - Murder Mystery 2 item values, trade calculator, demand list" />
  <link rel="icon" type="image/png" href="https://i.postimg.cc/MGbKQXh8/file-000000008e88821090c045e726e1623c.png" />
  <link rel="stylesheet" href="style.css" />
  <meta property="og:image" content="https://i.postimg.cc/MGbKQXh8/file-000000008e88821090c045e726e1623c.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="https://i.postimg.cc/MGbKQXh8/file-000000008e88821090c045e726e1623c.png" />
</head>
<body>

  <!-- LOADER -->
  <div id="loader">
    <div class="loader-icon">💎</div>
    <div class="loader-spinner"></div>
    <div class="loader-text">MM2 Vault yüklənir...</div>
  </div>

  <!-- HEADER -->
  <header>
    <div class="logo"><span class="brand-mark">MM2</span> MM2 Vault</div>
    <div class="logo-subtitle">Trade Values &amp; Item Archive</div>
    
    <div class="stats">
      <span class="stat-badge">📦 <strong id="itemCount">0</strong> Items</span>
      <span class="stat-badge">⭐ <strong id="favCount">0</strong> Favorites</span>
    </div>

    <nav>
      <a href="index.html" class="active" data-i18n="home">🏠 Ana Səhifə</a>
      <a href="trade.html" data-i18n="trade">⚖️ Trade</a>
      <a href="favorites.html" data-i18n="favorites">⭐ Favorilər</a>
      <a href="admin.html" data-i18n="admin">🛠️ Admin</a>
    </nav>
    <div class="home-auth">
      <button id="homeGoogleLogin" class="admin-button" data-i18n="login">🔐 Google ilə giriş</button>
      <span id="homeAuthStatus" class="auth-status"></span>
      <div id="homeAccount" class="home-account hidden"></div>
    </div>
    <a class="discord-join" data-i18n="discord" href="https://discord.gg/JJmEGx9mN3" target="_blank" rel="noopener noreferrer">Discorda qoşul</a>
    <div class="social-links"><a class="social-link tiktok" data-i18n="tiktok" href="https://www.tiktok.com/@mm2_ultimatehub?_r=1&_t=ZS-99afIDHeR9z" target="_blank" rel="noopener noreferrer">TikTok</a><a class="social-link youtube" data-i18n="youtube" href="https://youtube.com/@mm2_ultimatehub?si=GOJuAj5E8oGq5SvF" target="_blank" rel="noopener noreferrer">YouTube</a></div>
  </header>

  <!-- TOOLS -->
  <section class="tools">
    <input id="searchInput" type="text" data-i18n-placeholder="search" placeholder="🔍 Item ara..." />
    <select id="categoryFilter">
      <option value="all" data-i18n="categories">📦 Bütün Kateqoriyalar</option>
      <option value="Chroma">🌈 Chroma</option>
      <option value="Godly">🟣 Godly</option>
      <option value="Ancient">⚔️ Ancient</option>
      <option value="Unique">👑 Unique</option>
      <option value="Vintage">🕰️ Vintage</option>
      <option value="Legendary">🔵 Legendary</option>
      <option value="Rare">🟢 Rare</option>
      <option value="Uncommon">🟡 Uncommon</option>
      <option value="Common">⚪ Common</option>
    </select>
    <select id="sortFilter">
      <option value="default" data-i18n="sort">📊 Sırala</option>
      <option value="high">💰 Dəyər (Yüksək → Aşağı)</option>
      <option value="low">💰 Dəyər (Aşağı → Yüksək)</option>
      <option value="demand">🔥 Tələb</option>
      <option value="az">🔤 A → Z</option>
      <option value="za">🔤 Z → A</option>
    </select>
  </section>

  <section class="market-pulse" aria-label="Market Pulse">
    <div><span class="pulse-dot"></span><strong>MARKET PULSE</strong><small id="pulseSummary">Dəyər dəyişiklikləri izlənir</small></div>
    <div id="pulseItems" class="pulse-items"></div>
  </section>

  <!-- TOP ITEMS -->
  <section class="top-section">
    <h2><span>🔥</span> <span data-i18n="top">Ən Dəyərli Itemlər</span></h2>
    <div id="topItems" class="items" style="grid-template-columns:repeat(auto-fill,minmax(180px,1fr));"></div>
  </section>

  <!-- ALL ITEMS -->
  <section id="itemsContainer" class="items"></section>

  <!-- TOAST -->
  <div id="toast"></div>

  <footer>
    <p>© 2026 MM2 Vault • Made for Roblox Players</p>
  </footer>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="firebase-init.js"></script>
  <script src="i18n.js"></script>
  <script src="auth.js"></script>
  <script src="script.js"></script>

</body>
</html>
