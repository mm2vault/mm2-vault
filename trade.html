<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MM2 Vault - Trade Kalkulyatoru</title>
  <link rel="icon" type="image/png" href="default.png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- LOADER -->
  <div id="loader">
    <div class="loader-icon">⚖️</div>
    <div class="loader-spinner"></div>
    <div class="loader-text">Trade yüklənir...</div>
  </div>

  <!-- HEADER -->
  <header>
    <div class="logo"><span class="brand-mark">MM2</span> Trade</div>
    <div class="logo-subtitle">Trade dəyərini hesabla</div>

    <nav>
      <a href="index.html" data-i18n="home">🏠 Ana Səhifə</a>
      <a href="trade.html" class="active" data-i18n="trade">⚖️ Trade</a>
      <a href="favorites.html" data-i18n="favorites">⭐ Favorilər</a>
      <a href="admin.html" data-i18n="admin">🛠️ Admin</a>
    </nav>
  </header>
  <a class="discord-join page-discord" data-i18n="discord" href="https://discord.gg/JJmEGx9mN3" target="_blank" rel="noopener noreferrer">Discorda qoşul</a>
  <div class="social-links page-social"><a class="social-link tiktok" data-i18n="tiktok" href="https://www.tiktok.com/@mm2_ultimatehub?_r=1&_t=ZS-99afIDHeR9z" target="_blank" rel="noopener noreferrer">TikTok</a><a class="social-link youtube" data-i18n="youtube" href="https://youtube.com/@mm2_ultimatehub?si=GOJuAj5E8oGq5SvF" target="_blank" rel="noopener noreferrer">YouTube</a></div>

  <!-- TRADE CONTAINER -->
  <div class="trade-container">
    <!-- GIVE -->
    <section class="trade-card give">
      <h2><span data-i18n="give">🔴 Sən Verirsən</span></h2>
      <div class="search-area">
        <input id="giveSearch" data-i18n-placeholder="search" placeholder="🔍 Item ara..." />
        <button onclick="toggleGiveList()">📦 Liste</button>
      </div>
      <div id="giveResults"></div>
      <div class="selected">
        <h3 style="font-size:14px;color:var(--text-secondary);margin-bottom:8px;">Seçilənlər</h3>
        <div id="giveSelected"></div>
      </div>
      <h3>💰 Dəyər: <span id="giveValue">0</span></h3>
    </section>

    <!-- TAKE -->
    <section class="trade-card take">
      <h2><span data-i18n="take">🟢 Qarşı Tərəf</span></h2>
      <div class="search-area">
        <input id="takeSearch" data-i18n-placeholder="search" placeholder="🔍 Item ara..." />
        <button onclick="toggleTakeList()">📦 Liste</button>
      </div>
      <div id="takeResults"></div>
      <div class="selected">
        <h3 style="font-size:14px;color:var(--text-secondary);margin-bottom:8px;">Seçilənlər</h3>
        <div id="takeSelected"></div>
      </div>
      <h3>💰 Dəyər: <span id="takeValue">0</span></h3>
    </section>
  </div>

  <!-- RESULT -->
  <div id="result" class="trade-result">⚖️ Trade gözləyir...</div>
  <div class="trade-actions"><button id="saveTrade" class="admin-button" type="button">💾 Trade-i yadda saxla</button></div>
  <section class="trade-history-panel"><div class="history-heading"><h2>🕘 Trade tarixçəsi</h2><button id="clearTradeHistory" class="admin-button secondary">Təmizlə</button></div><div id="tradeHistory"></div></section>

  <!-- TOAST -->
  <div id="toast"></div>

  <footer>
    <p>© 2026 MM2 Vault • Made for Roblox Players</p>
  </footer>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="firebase-init.js"></script>
  <script src="i18n.js"></script>
  <script src="trade.js"></script>

</body>
</html>
